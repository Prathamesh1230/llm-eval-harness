name: RAG Eval

# Runs the eval harness on every PR and push to main. If retrieval or
# answer quality regresses beyond threshold against the stored baseline,
# the build fails and the PR is blocked.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m evalharness.cli run -c configs/baseline.yaml > eval_output.txt
          cat eval_output.txt
          echo "RUN_ID=$(grep 'run_id:' eval_output.txt | awk '{print $2}')" >> $GITHUB_ENV

      - name: Check for regression
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BASELINE_RUN_ID: ${{ vars.BASELINE_RUN_ID }}
        run: |
          if [ -z "$BASELINE_RUN_ID" ]; then
            echo "No baseline set — skipping regression check."
            echo "Set BASELINE_RUN_ID in repo variables to enable gating."
            exit 0
          fi
          python -m evalharness.cli check "$BASELINE_RUN_ID" "$RUN_ID" --threshold 0.05

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval_output.txt
            eval_runs.db